    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #ff6b6b;
            --accent-success: #51cf66;
            --accent-warning: #ffd43b;
            --accent-danger: #ff6b6b;
            --accent-blue: #4dabf7;
            --border: #333333;
            --header-height: 160px;
        }

        html {
            background: var(--bg-primary);
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 100%;
            min-height: 100dvh;
        }

        button, input, textarea {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        button {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
            backdrop-filter: blur(10px);
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sticky-day-header {
            position: sticky;
            top: var(--header-height);
            background: var(--bg-primary);
            z-index: 50;
            padding-bottom: 8px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 4px 0 10px;
            margin: 0;
        }

        .first-pick-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent-success);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            margin: 0;
        }

        .first-pick-box strong {
            color: var(--accent);
        }

        .first-pick-box.first-pick-empty {
            border-left-color: var(--border);
            color: var(--text-secondary);
            font-style: italic;
        }

        .pick-info {
            flex: 1;
            min-width: 0;
        }

        .pick-lines {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .pick-now {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        // Real festival calendar dates, keyed to match the schedule's day labels
        const DAY_DATES = {
            'Saturday 1 August': '2026-08-01',
            'Sunday 2 August': '2026-08-02'
        };

        function todayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // Secondary stages that can be hidden from the timeline to reduce clutter.
        // Stage 1 / Stage 2 are always shown and have no toggle.
        const OPTIONAL_STAGES = ['Club Corner', 'Flower Garden'];

        let state = {
            // Yes/Maybe/No are independent toggles, combinable in any mix. "All" is a derived
            // shortcut, not real state - it just reflects whether all three happen to be on.
            filters: { yes: true, maybe: true, no: true },
            selections: {},
            notes: {},
            currentTime: new Date(),
            searchQuery: '',
            notificationsSent: {},
            // Which optional stages are shown on the timeline; defaults to collapsed/hidden
            stageToggles: Object.fromEntries(OPTIONAL_STAGES.map(s => [s, false])),
            // Default to today's festival day if we're on-site, otherwise the first day
            activeDay: Object.keys(DAY_DATES).find(d => DAY_DATES[d] === todayStr()) || Object.keys(schedule)[0]
        };

        // Load state from localStorage
        function loadState() {
            const saved = localStorage.getItem('festivalState');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.selections = parsed.selections || {};
                state.notes = parsed.notes || {};
                state.stageToggles = { ...state.stageToggles, ...(parsed.stageToggles || {}) };
            }
        }

        // Save state to localStorage - counts/filter badges are recomputed by the render() that always follows
        function saveState() {
            localStorage.setItem('festivalState', JSON.stringify({
                selections: state.selections,
                notes: state.notes,
                stageToggles: state.stageToggles
            }));
        }

        // Convert "HH:MM" to minutes since midnight
        function toMinutes(t) {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        // Find the earliest start / latest end (rounded to the hour) for a day's acts
        function computeDayRange(artists) {
            let min = Infinity, max = -Infinity;
            artists.forEach(a => {
                const s = toMinutes(a.start), e = toMinutes(a.end);
                if (s < min) min = s;
                if (e > max) max = e;
            });
            return { min: Math.floor(min / 60) * 60, max: Math.ceil(max / 60) * 60 };
        }

        // Build a colour-coded visual timeline for a day: one column per stage,
        // each act shown as a block positioned top-to-bottom by its actual time slot.
        function renderTimeline(artists, dateStr) {
            const stages = [...new Set(artists.map(a => a.stage))]
                .filter(s => !OPTIONAL_STAGES.includes(s) || state.stageToggles[s]);
            const { min, max } = computeDayRange(artists);
            const pxPerMin = 0.8;
            const trackHeight = (max - min) * pxPerMin;

            let rulerHtml = '';
            for (let t = min; t <= max; t += 60) {
                const top = (t - min) * pxPerMin;
                const hh = String(Math.floor(t / 60)).padStart(2, '0');
                rulerHtml += `<div class="timeline-vruler-label" style="top:${top}px">${hh}:00</div><div class="timeline-vruler-tick" style="top:${top}px"></div><div class="timeline-vgridline" style="top:${top}px"></div>`;
            }

            const colsHtml = stages.map(stage => {
                const blocksHtml = artists.filter(a => a.stage === stage).map(a => {
                    const s = toMinutes(a.start), e = toMinutes(a.end);
                    const top = (s - min) * pxPerMin;
                    const height = Math.max((e - s) * pxPerMin, 28);
                    const status = state.selections[a.id] || 'none';
                    const note = state.notes[a.id];
                    const notesLine = note ? `<div class="tvb-notes">📝 ${note}</div>` : '';
                    const dimmed = !matchesFilter(a) ? ' dimmed' : '';
                    return `<div class="timeline-vblock status-${status}${dimmed}" style="top:${top}px;height:${height}px" data-target="${a.id}" title="${a.name} (${a.start}-${a.end})${note ? ' — ' + note : ''}">
                        <div class="tvb-name">${a.name}</div>
                        <div class="tvb-time">${a.start}-${a.end}</div>
                        ${notesLine}
                    </div>`;
                }).join('');
                return `<div class="timeline-vcol">${blocksHtml}</div>`;
            }).join('');

            // Live "NOW" marker - only drawn when this timeline's date is today and the time falls in range
            let nowLineHtml = '';
            if (dateStr === todayStr()) {
                const now = new Date();
                const nowMin = now.getHours() * 60 + now.getMinutes();
                if (nowMin >= min && nowMin <= max) {
                    const top = (nowMin - min) * pxPerMin;
                    nowLineHtml = `<div class="timeline-now-line" style="top:${top}px"><span class="timeline-now-label">NOW</span></div>`;
                }
            }

            return `
                <div class="timeline-vwrap">
                    <div class="timeline-vheader">
                        <div class="timeline-vheader-spacer"></div>
                        ${stages.map(s => `<div class="timeline-vcol-title">${s}</div>`).join('')}
                    </div>
                    <div class="timeline-vbody" style="height:${trackHeight}px">
                        <div class="timeline-vruler">${rulerHtml}</div>
                        ${colsHtml}
                        ${nowLineHtml}
                    </div>
                </div>
            `;
        }

        // Tally of Yes/Maybe/No for just the given day's lineup, used for the filter button badges
        function getCounts(artists) {
            const counts = { yes: 0, maybe: 0, no: 0 };
            artists.forEach(a => {
                const selection = state.selections[a.id];
                if (counts.hasOwnProperty(selection)) counts[selection]++;
            });
            return counts;
        }

        // The Yes/Maybe acts still to come for a given day's lineup, earliest first.
        // On today's actual festival date, picks whose start time has already passed are skipped
        // in favor of the next upcoming ones. On any other day (past or future), the full pick list.
        function getUpcomingPick(artists, dateStr) {
            const picks = artists
                .filter(a => ['yes', 'maybe'].includes(state.selections[a.id]))
                .sort((a, b) => toMinutes(a.start) - toMinutes(b.start));
            if (picks.length === 0) return { pick: null, andThen: null, allStarted: false };

            let upcoming = picks;
            if (dateStr === todayStr()) {
                const now = new Date();
                const nowMin = now.getHours() * 60 + now.getMinutes();
                const startIdx = picks.findIndex(a => toMinutes(a.start) > nowMin);
                upcoming = startIdx === -1 ? [] : picks.slice(startIdx);
            }

            return {
                pick: upcoming[0] || null,
                andThen: upcoming[1] || null,
                allStarted: upcoming.length === 0
            };
        }

        // Render schedule - only the currently active day, selected via the day-tabs
        function render() {
            const container = document.getElementById('schedule');
            let html = '';

            document.querySelectorAll('.day-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.day === state.activeDay);
            });

            {
                const day = state.activeDay;
                const artists = schedule[day];
                const dateStr = DAY_DATES[day];
                const counts = getCounts(artists);
                const { pick, andThen, allStarted } = getUpcomingPick(artists, dateStr);

                const nowCluster = `<div class="pick-now"><button class="action-btn" id="now-playing-btn">Now</button></div>`;

                let pickBoxHtml;
                if (pick) {
                    const andThenHtml = andThen
                        ? `<div class="pick-info">➡️ And then: <strong>${andThen.start}</strong> — ${andThen.name} (${andThen.stage}) ${state.selections[andThen.id] === 'yes' ? '✅' : '🤔'}</div>`
                        : '';
                    pickBoxHtml = `<div class="first-pick-box">
                        <div class="pick-lines">
                            <div class="pick-info">🎯 Next pick: <strong>${pick.start}</strong> — ${pick.name} (${pick.stage}) ${state.selections[pick.id] === 'yes' ? '✅' : '🤔'}</div>
                            ${andThenHtml}
                        </div>
                        ${nowCluster}
                    </div>`;
                } else if (allStarted) {
                    pickBoxHtml = `<div class="first-pick-box first-pick-empty"><div class="pick-info">No more picks left today</div>${nowCluster}</div>`;
                } else {
                    pickBoxHtml = `<div class="first-pick-box first-pick-empty"><div class="pick-info">No Yes/Maybe picks yet for this day</div>${nowCluster}</div>`;
                }

                const allActive = state.filters.yes && state.filters.maybe && state.filters.no;

                html += `<div class="day-section">
                    <div class="sticky-day-header">
                        <div class="day-title">${day}</div>
                        <div class="filter-tabs">
                            <button class="filter-btn ${allActive ? 'active' : ''}" data-filter="all">All</button>
                            <button class="filter-btn ${state.filters.yes ? 'active' : ''}" data-filter="yes">✅ Yes <span>${counts.yes}</span></button>
                            <button class="filter-btn ${state.filters.maybe ? 'active' : ''}" data-filter="maybe">🤔 Maybe <span>${counts.maybe}</span></button>
                            <button class="filter-btn ${state.filters.no ? 'active' : ''}" data-filter="no">🔴 No <span>${counts.no}</span></button>
                        </div>
                        ${pickBoxHtml}
                    </div>
                    ${renderTimeline(artists, dateStr)}
                </div>`;
            }

            container.innerHTML = html;
            attachEventListeners();
            syncStickyOffsets();
        }

        // Whether a single artist matches the active filter toggles + search box.
        // Non-matches aren't removed from view - see the "dimmed" class in render()/renderTimeline().
        function matchesFilter(artist) {
            if (state.searchQuery) {
                const query = state.searchQuery.toLowerCase();
                if (!artist.name.toLowerCase().includes(query) &&
                    !artist.genre.toLowerCase().includes(query) &&
                    !artist.description.toLowerCase().includes(query)) {
                    return false;
                }
            }

            const selection = state.selections[artist.id] || 'none';
            if (selection === 'yes') return state.filters.yes;
            if (selection === 'maybe') return state.filters.maybe;
            if (selection === 'no') return state.filters.no;
            return true; // undecided artists aren't gated by the Yes/Maybe/No toggles
        }

        // Request notification permissions
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        // Show notification
        function showNotification(artist, minutesBefore = 10) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(`${artist.name} in ${minutesBefore} minutes!`, {
                    body: `${artist.start} - ${artist.end} at ${artist.stage}`,
                    icon: '🎵'
                });
            }
        }

        // Check for upcoming performances
        function checkUpcomingPerformances() {
            const now = new Date();
            let upcomingCount = 0;

            Object.entries(schedule).forEach(([day, artists]) => {
                const [year, month, dayNum] = DAY_DATES[day].split('-').map(Number);

                artists.forEach(artist => {
                    if (state.selections[artist.id] !== 'yes') return;

                    const [startH, startM] = artist.start.split(':').map(Number);
                    const startTime = new Date(year, month - 1, dayNum, startH, startM);
                    const minutesUntil = (startTime - now) / 60000;

                    if (minutesUntil > 0 && minutesUntil <= 10.5 && !state.notificationsSent[artist.id]) {
                        showNotification(artist, Math.round(minutesUntil));
                        state.notificationsSent[artist.id] = true;
                        upcomingCount++;
                    }
                });
            });

            const badge = document.getElementById('notification-badge');
            if (upcomingCount > 0) {
                badge.textContent = upcomingCount;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // WMO weather codes (used by Open-Meteo) mapped to an icon + short label
        function weatherFromCode(code) {
            const map = {
                0: ['☀️', 'Clear'], 1: ['🌤️', 'Mostly clear'], 2: ['⛅', 'Partly cloudy'], 3: ['☁️', 'Overcast'],
                45: ['🌫️', 'Fog'], 48: ['🌫️', 'Fog'],
                51: ['🌦️', 'Light drizzle'], 53: ['🌦️', 'Drizzle'], 55: ['🌦️', 'Heavy drizzle'],
                56: ['🌧️', 'Freezing drizzle'], 57: ['🌧️', 'Freezing drizzle'],
                61: ['🌧️', 'Light rain'], 63: ['🌧️', 'Rain'], 65: ['🌧️', 'Heavy rain'],
                66: ['🌧️', 'Freezing rain'], 67: ['🌧️', 'Freezing rain'],
                71: ['🌨️', 'Light snow'], 73: ['🌨️', 'Snow'], 75: ['🌨️', 'Heavy snow'], 77: ['🌨️', 'Snow grains'],
                80: ['🌦️', 'Rain showers'], 81: ['🌦️', 'Rain showers'], 82: ['⛈️', 'Violent showers'],
                85: ['🌨️', 'Snow showers'], 86: ['🌨️', 'Snow showers'],
                95: ['⛈️', 'Thunderstorm'], 96: ['⛈️', 'Thunderstorm + hail'], 99: ['⛈️', 'Thunderstorm + hail']
            };
            return map[code] || ['🌡️', 'Forecast'];
        }

        function applyWeather(prefix, day) {
            if (!day) { applyWeatherUnavailable(prefix); return; }
            const [icon, desc] = weatherFromCode(day.code);
            document.getElementById(`weather-icon-${prefix}`).textContent = icon;
            document.getElementById(`weather-desc-${prefix}`).textContent = `${day.min}°-${day.max}°C · ${desc}`;
        }

        function applyWeatherUnavailable(prefix) {
            document.getElementById(`weather-icon-${prefix}`).textContent = '🌐';
            document.getElementById(`weather-desc-${prefix}`).textContent = 'Forecast unavailable';
        }

        // Real forecast for Cherry Hinton Hall, Cambridge, via Open-Meteo (free, no API key required).
        // Only has data within its forecast window (~16 days out) - falls back to "unavailable" outside that.
        async function fetchWeather() {
            const lat = 52.184, lon = 0.148;
            const dates = Object.values(DAY_DATES);
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe/London&start_date=${dates[0]}&end_date=${dates[dates.length - 1]}`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Weather request failed');
                const data = await res.json();
                if (!data.daily || !data.daily.time) throw new Error('No forecast data');

                const byDate = {};
                data.daily.time.forEach((date, i) => {
                    byDate[date] = {
                        code: data.daily.weathercode[i],
                        max: Math.round(data.daily.temperature_2m_max[i]),
                        min: Math.round(data.daily.temperature_2m_min[i])
                    };
                });

                applyWeather('sat', byDate[DAY_DATES['Saturday 1 August']]);
                applyWeather('sun', byDate[DAY_DATES['Sunday 2 August']]);
            } catch (err) {
                applyWeatherUnavailable('sat');
                applyWeatherUnavailable('sun');
            }
        }

        // Re-bound after every render() call, since #schedule's contents are fully
        // regenerated each time. Header controls (and the sheet's own controls) are static
        // and wired once elsewhere instead - see attachStaticListeners() and openArtistSheet().
        function attachEventListeners() {
            // Timeline blocks - tap to open the artist's detail sheet
            document.querySelectorAll('.timeline-vblock').forEach(block => {
                block.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const artist = findArtistById(block.dataset.target);
                    if (artist) openArtistSheet(artist);
                });
            });

            // Filter tabs - Yes/Maybe/No toggle independently; "All" is a shortcut that turns all three on.
            // Regenerated with fresh counts on every render(), same as the timeline blocks above.
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.filter;
                    if (key === 'all') {
                        state.filters.yes = true;
                        state.filters.maybe = true;
                        state.filters.no = true;
                    } else {
                        state.filters[key] = !state.filters[key];
                    }
                    // Selecting a filter clears any active search, so the two don't fight over what's dimmed
                    state.searchQuery = '';
                    const searchInput = document.getElementById('search-input');
                    if (searchInput) searchInput.value = '';
                    render();
                });
            });

            // "Now Playing" jumps to the live marker on the timeline. Lives on the pick box now,
            // so - like the filter tabs above - it's regenerated each render() and rebound here rather
            // than in attachStaticListeners(). scrollIntoView doesn't account for the sticky header's
            // height when aligning an element's top, so it can leave the target partly hidden underneath
            // it - compute the scroll offset manually instead for a reliable result.
            const nowBtn = document.getElementById('now-playing-btn');
            if (nowBtn) {
                nowBtn.addEventListener('click', () => {
                    // Two sticky layers sit above the scrolling content now: the main header,
                    // and the day-title/filter-tabs/pick-box group stuck right below it. Both
                    // need to be subtracted, or the target lands hidden underneath the second one.
                    const header = document.querySelector('.header');
                    const stickyDayHeader = document.querySelector('.sticky-day-header');
                    const stuckHeight = (header ? header.offsetHeight : 0) + (stickyDayHeader ? stickyDayHeader.offsetHeight : 0);
                    const nowLine = document.querySelector('.timeline-now-line');

                    if (nowLine) {
                        const rect = nowLine.getBoundingClientRect();
                        const visibleHeight = window.innerHeight - stuckHeight;
                        const targetY = window.scrollY + rect.top - stuckHeight - (visibleHeight / 2);
                        window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
                        return;
                    }

                    const wrap = document.querySelector('.timeline-vwrap');
                    if (wrap) {
                        const rect = wrap.getBoundingClientRect();
                        const targetY = window.scrollY + rect.top - stuckHeight - 8;
                        window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
                    }
                });
            }
        }

        // Wired once at init, not on every render() - these controls live in the
        // static header/day-tabs markup and are never removed or recreated.
        function attachStaticListeners() {
            document.querySelectorAll('.day-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.activeDay = btn.dataset.day;
                    render();
                });
            });

            document.getElementById('search-input').addEventListener('input', (e) => {
                state.searchQuery = e.target.value;
                render();
            });

            // Header "..." dropdown - combines notifications/backup/stages into one menu
            const menuBtn = document.getElementById('menu-btn');
            const dropdownMenu = document.getElementById('dropdown-menu');

            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownMenu.classList.toggle('show');
            });

            document.addEventListener('click', (e) => {
                if (dropdownMenu.classList.contains('show') && !dropdownMenu.contains(e.target) && e.target !== menuBtn) {
                    dropdownMenu.classList.remove('show');
                }
            });

            document.getElementById('menu-notifications').addEventListener('click', () => {
                dropdownMenu.classList.remove('show');
                requestNotificationPermission();
            });

            document.getElementById('menu-backup').addEventListener('click', () => {
                dropdownMenu.classList.remove('show');
                openDataSheet();
            });

            document.getElementById('menu-stages').addEventListener('click', () => {
                dropdownMenu.classList.remove('show');
                openStagesSheet();
            });
        }

        // Look up an artist's full record by id across both festival days
        function findArtistById(id) {
            for (const day in schedule) {
                const found = schedule[day].find(a => a.id === id);
                if (found) return found;
            }
            return null;
        }

        // Open the bottom sheet with an artist's full detail
        function openArtistSheet(artist) {
            const selection = state.selections[artist.id] || 'none';
            const notes = state.notes[artist.id] || '';

            document.getElementById('sheet-content').innerHTML = `
                <div class="sheet-time">${artist.start} - ${artist.end} · ${artist.stage}</div>
                <div class="sheet-title">${artist.name}</div>

                <div class="status-cycle sheet-status">
                    <button class="status-btn ${selection === 'yes' ? 'active' : ''}" data-status="yes">Yes</button>
                    <button class="status-btn ${selection === 'maybe' ? 'active' : ''}" data-status="maybe">Maybe</button>
                    <button class="status-btn ${selection === 'no' ? 'active' : ''}" data-status="no">No</button>
                </div>

                <div class="sheet-desc">${artist.description}</div>

                <div class="detail-row">
                    <span class="detail-label">Genre</span>
                    <span class="detail-value">${artist.genre}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Country</span>
                    <span class="detail-value">${artist.country}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Sounds Like</span>
                    <span class="detail-value">${artist.soundsLike}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Why Worth Seeing</span>
                    <span class="detail-value">${artist.reason}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Duration</span>
                    <span class="detail-value">${artist.duration}</span>
                </div>

                <div class="notes-section">
                    <div class="notes-label">📝 Notes</div>
                    <textarea class="notes-input" placeholder="Add personal notes...">${notes}</textarea>
                </div>
            `;

            // Yes/Maybe/No inside the sheet - re-render the page behind it, then close
            // the sheet since the pick is made
            document.querySelectorAll('#sheet-content .status-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const status = btn.dataset.status;
                    const current = state.selections[artist.id];
                    state.selections[artist.id] = current === status ? 'none' : status;
                    saveState();
                    render();
                    checkUpcomingPerformances();
                    closeSheet();
                });
            });

            // Notes textarea inside the sheet
            const sheetNotesInput = document.querySelector('#sheet-content .notes-input');
            sheetNotesInput.addEventListener('change', () => {
                state.notes[artist.id] = sheetNotesInput.value;
                saveState();
            });

            document.getElementById('sheet-overlay').classList.add('show');
            document.getElementById('bottom-sheet').classList.add('show');
        }

        // Backup/restore sheet - lets picks & notes move between devices/browsers,
        // since they otherwise only live in this browser's localStorage.
        // Straight to a file both ways - no copy/paste step.
        function openDataSheet() {
            document.getElementById('sheet-content').innerHTML = `
                <div class="sheet-title">Backup &amp; Restore</div>
                <div class="sheet-desc">Save your Yes/Maybe/No picks and notes to a file, or load a previously saved file. Loading a file replaces your current picks.</div>
                <div class="links">
                    <button class="link-btn" id="export-btn">📤 Save to file</button>
                    <button class="link-btn" id="import-btn">📥 Load from file</button>
                </div>
                <input type="file" accept="application/json,.json" id="import-file" style="display:none">
            `;

            document.getElementById('export-btn').addEventListener('click', () => {
                const payload = JSON.stringify({
                    selections: state.selections,
                    notes: state.notes,
                    stageToggles: state.stageToggles
                }, null, 2);
                const blob = new Blob([payload], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `folk-festival-picks-${todayStr()}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                closeSheet();
            });

            const fileInput = document.getElementById('import-file');
            document.getElementById('import-btn').addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    let parsed;
                    try {
                        parsed = JSON.parse(reader.result);
                    } catch {
                        alert("That doesn't look like a valid backup file.");
                        return;
                    }
                    state.selections = parsed.selections || {};
                    state.notes = parsed.notes || {};
                    state.stageToggles = { ...state.stageToggles, ...(parsed.stageToggles || {}) };
                    saveState();
                    render();
                    checkUpcomingPerformances();
                    closeSheet();
                };
                reader.readAsText(file);
            });

            document.getElementById('sheet-overlay').classList.add('show');
            document.getElementById('bottom-sheet').classList.add('show');
        }

        // Which optional stages show up in the timeline - Stage 1/2 are core and always shown
        function openStagesSheet() {
            const rowsHtml = OPTIONAL_STAGES.map(stage => `
                <label class="stage-check-row">
                    <input type="checkbox" data-stage="${stage}" ${state.stageToggles[stage] ? 'checked' : ''}>
                    <span>${stage}</span>
                </label>
            `).join('');

            document.getElementById('sheet-content').innerHTML = `
                <div class="sheet-title">Visible Stages</div>
                <div class="sheet-desc">Choose which stages show up in the timeline. Stage 1 and Stage 2 are always shown.</div>
                ${rowsHtml}
            `;

            document.querySelectorAll('#sheet-content .stage-check-row input').forEach(input => {
                input.addEventListener('change', () => {
                    state.stageToggles[input.dataset.stage] = input.checked;
                    saveState();
                    render();
                });
            });

            document.getElementById('sheet-overlay').classList.add('show');
            document.getElementById('bottom-sheet').classList.add('show');
        }

        function closeSheet() {
            document.getElementById('sheet-overlay').classList.remove('show');
            document.getElementById('bottom-sheet').classList.remove('show');
        }

        // Sheet close controls - wired once since the sheet markup itself is static, not re-rendered
        document.getElementById('sheet-overlay').addEventListener('click', closeSheet);
        document.getElementById('sheet-close').addEventListener('click', closeSheet);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSheet();
        });

        // Keeps the sticky day-header group's offset matched to the header's real (dynamic)
        // height, so it docks flush below it - with only the timeline scrolling underneath -
        // instead of relying on a stale hardcoded value. Day-title/filter-tabs/first-pick-box
        // are all one sticky unit now (.sticky-day-header), so this is the only offset needed.
        function syncStickyOffsets() {
            const header = document.querySelector('.header');
            document.documentElement.style.setProperty('--header-height', (header ? header.offsetHeight : 0) + 'px');
        }

        // Initialize
        loadState();
        attachStaticListeners();
        render();
        syncStickyOffsets();
        fetchWeather().then(syncStickyOffsets);
        checkUpcomingPerformances();
        window.addEventListener('resize', syncStickyOffsets);

        // Update "now playing" every minute
        setInterval(() => {
            state.currentTime = new Date();
            render();
        }, 60000);

        // Check for upcoming performances every minute
        setInterval(checkUpcomingPerformances, 60000);
    </script>
</body>
</html>
